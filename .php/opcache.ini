; Loaded for the web process only, through PHP_INI_SCAN_DIR=":/app/.php" in the Procfile.
;
; The web process is PHP's built-in server (`php artisan serve`), which runs under the CLI SAPI, where
; OPcache is off unless asked. Without it every request compiles every PHP file of the framework again.
; The workers (PHP_CLI_SERVER_WORKERS) are forked after start-up, so they share one OPcache memory.
;
; validate_timestamps=0: files never change inside a running container (a deploy builds a new one), so
; PHP does not stat them on every request. Do not use this ini on a machine where code is edited in place.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0

; Cheaper path lookups for the many small files Composer's autoloader opens.
realpath_cache_size=4096K
realpath_cache_ttl=600
